# MySQL ו-phpMyAdmin לפיתוח מקומי.
# השירות api (ה-Backend) הוא חלופה להרצה הרגילה, ועולה רק עם: docker compose --profile api up -d
services:
  mysql:
    image: mysql:8.0
    container_name: chat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chat_root_pass   # סיסמה מקומית לפיתוח, זהה ל-DB_PASSWORD ב-Backend/.env
      MYSQL_DATABASE: chat_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # ה-api מחכה עד ש-MySQL מוכן לחיבורים (בהרצה הראשונה זה לוקח כחצי דקה)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchat_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin
    container_name: chat_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql

  api:
    build: ./Backend
    container_name: chat_api
    restart: unless-stopped
    profiles: ["api"]
    env_file: ./Backend/.env
    environment:
      DB_HOST: mysql   # בתוך דוקר מתחברים לשם השירות, ולא ל-localhost שב-.env
      DB_PORT: "3306"
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app   # הקוד ותיקיית uploads מהמחשב. שינוי בקוד נטען מחדש (--reload)
      - /app/env         # מסתיר את הסביבה הווירטואלית של Windows מתוך הקונטיינר
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
